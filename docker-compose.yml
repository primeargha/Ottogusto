# version: '3.8'
name: OttoGusto

services:
  ottogusto_nextjs:
    build:
      context: ./next/
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    ports:
      - '3000:3000'
    volumes:
      - './next/public:/app/public'
      - './next/src:/app/src'
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - ottogusto_nextjs